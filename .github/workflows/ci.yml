name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shunpike
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: shunpike
      # These release tags replace the local fork working trees at publication.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Silo-Server/quic-go
          ref: v0.64.1-patch.1
          path: forks/quic-go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Silo-Server/tailscale
          ref: v1.104.2-patch.1
          path: forks/tailscale
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: shunpike/go.mod
          cache-dependency-path: shunpike/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run
      - run: bash scripts/check-ci.sh
